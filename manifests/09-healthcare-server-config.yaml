apiVersion: v1
kind: ConfigMap
metadata:
  name: healthcare-server-config
  namespace: rhdg-poc
data:
  infinispan-config.yaml: |
    infinispan:
      cacheContainer:
        caches:
          respCache:
            distributedCache:
              aliases:
                - "0"
              owners: "2"
              keyPartitioner: "org.infinispan.distribution.ch.impl.RESPHashFunctionPartitioner"
              mode: "SYNC"
              statistics: "true"
              encoding:
                key:
                  mediaType: "application/octet-stream"
                value:
                  mediaType: "application/x-protostream"
              expiration:
                lifespan: "300000"
              memory:
                maxCount: "100000"
                whenFull: "REMOVE"
      server:
        endpoints:
          - securityRealm: default
            socketBinding: default
            hotrodConnector: ~
            restConnector: ~
            respConnector: ~

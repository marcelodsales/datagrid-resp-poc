<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <style>
      .title { font-size: 18px; font-weight: 700; fill: #1a1a1a; }
      .subtitle { font-size: 12px; fill: #555; }
      .cluster-label { font-size: 14px; font-weight: 700; fill: #fff; }
      .cluster-detail { font-size: 10px; fill: #e0e0e0; }
      .cache-label { font-size: 10px; font-weight: 600; fill: #1a1a1a; }
      .cache-detail { font-size: 9px; fill: #555; }
      .app-label { font-size: 10px; font-weight: 600; fill: #1a1a1a; }
      .app-detail { font-size: 9px; fill: #555; }
      .app-proto { font-size: 8px; font-weight: 600; }
      .section-label { font-size: 11px; font-weight: 700; fill: #666; letter-spacing: 1px; }
      .box-operator { fill: #2b2b2b; rx: 6; }
      .box-monitoring { fill: #1b5e20; rx: 6; }
      .box-healthcare { fill: #0d47a1; rx: 8; }
      .box-platform { fill: #4a148c; rx: 8; }
      .box-cache-dist { fill: #e3f2fd; stroke: #1565c0; stroke-width: 1.5; rx: 4; }
      .box-cache-repl { fill: #f3e5f5; stroke: #7b1fa2; stroke-width: 1.5; rx: 4; }
      .box-cache-auto { fill: #fff8e1; stroke: #f9a825; stroke-width: 1.5; rx: 4; }
      .box-app { fill: #fff; stroke: #bdbdbd; stroke-width: 1.2; rx: 5; }
      .box-redis { fill: #fff; stroke: #d32f2f; stroke-width: 1.5; rx: 5; }
      .box-namespace { fill: none; stroke: #ccc; stroke-width: 2; stroke-dasharray: 8,4; rx: 12; }
      .box-apps-group { fill: #f5f5f5; stroke: #e0e0e0; stroke-width: 1; rx: 6; }
      .proto-resp { fill: #d32f2f; }
      .proto-hotrod { fill: #1565c0; }
      .proto-rest { fill: #2e7d32; }
      .legend-text { font-size: 9px; fill: #555; }
      .resp-bar { fill: #e8eaf6; stroke: #5c6bc0; stroke-width: 1; rx: 4; }
      .resp-bar-text { font-size: 10px; fill: #3949ab; font-weight: 600; }
    </style>
  </defs>

  <!-- Namespace boundary -->
  <rect x="20" y="20" width="1060" height="680" class="box-namespace"/>
  <text x="540" y="50" text-anchor="middle" class="title">Red Hat Data Grid 8.6 : Cache as a Service</text>
  <text x="540" y="68" text-anchor="middle" class="subtitle">OpenShift Cluster : Namespace: rhdg-poc</text>

  <!-- Row 1: Operator + Monitoring -->
  <rect x="40" y="85" width="200" height="40" class="box-operator"/>
  <text x="140" y="108" text-anchor="middle" class="cluster-label" style="font-size:12px;">Data Grid Operator</text>
  <text x="140" y="120" text-anchor="middle" class="cluster-detail">OperatorHub : channel: stable</text>

  <rect x="860" y="85" width="200" height="40" class="box-monitoring"/>
  <text x="960" y="108" text-anchor="middle" class="cluster-label" style="font-size:12px;">Monitoring</text>
  <text x="960" y="120" text-anchor="middle" class="cluster-detail">Prometheus + ServiceMonitor</text>

  <!-- ================================================================ -->
  <!-- LEFT COLUMN: healthcare cluster + its apps                       -->
  <!-- ================================================================ -->

  <!-- Healthcare cluster -->
  <rect x="40" y="145" width="490" height="250" class="box-healthcare"/>
  <text x="60" y="172" class="cluster-label">Cluster: healthcare</text>
  <text x="60" y="188" class="cluster-detail">2 replicas · 500m CPU · 1Gi mem · No persistence · RESP enabled</text>

  <!-- Healthcare caches -->
  <rect x="60" y="200" width="200" height="55" class="box-cache-dist"/>
  <text x="160" y="218" text-anchor="middle" class="cache-label">event-tracking</text>
  <text x="160" y="232" text-anchor="middle" class="cache-detail">Distributed · SYNC · 2 owners</text>
  <text x="160" y="244" text-anchor="middle" class="cache-detail">TTL 5 min · 100K entries</text>

  <rect x="280" y="200" width="200" height="55" class="box-cache-repl"/>
  <text x="380" y="218" text-anchor="middle" class="cache-label">app-config</text>
  <text x="380" y="232" text-anchor="middle" class="cache-detail">Replicated · SYNC · all nodes</text>
  <text x="380" y="244" text-anchor="middle" class="cache-detail">No TTL · 10K entries</text>

  <rect x="60" y="268" width="200" height="45" class="box-cache-auto"/>
  <text x="160" y="286" text-anchor="middle" class="cache-label">respCache</text>
  <text x="160" y="300" text-anchor="middle" class="cache-detail">Auto-created · octet-stream · CRC16</text>

  <!-- RESP endpoint bar -->
  <rect x="60" y="330" width="450" height="28" class="resp-bar"/>
  <text x="285" y="349" text-anchor="middle" class="resp-bar-text">RESP endpoint : port 11222 (Redis-compatible)</text>

  <!-- Healthcare apps group -->
  <text x="285" y="415" text-anchor="middle" class="section-label">APPLICATIONS → healthcare</text>

  <rect x="40" y="425" width="490" height="145" class="box-apps-group"/>

  <!-- redis-client-app -->
  <rect x="55" y="438" width="145" height="60" class="box-app"/>
  <text x="127" y="456" text-anchor="middle" class="app-label">redis-client-app</text>
  <text x="127" y="470" text-anchor="middle" class="app-detail">Spring Boot + Jedis</text>
  <rect x="80" y="480" width="95" height="14" rx="3" fill="#ffebee"/>
  <text x="127" y="490" text-anchor="middle" class="app-proto proto-resp">RESP · respCache</text>

  <!-- spring-cache-app -->
  <rect x="212" y="438" width="145" height="60" class="box-app"/>
  <text x="284" y="456" text-anchor="middle" class="app-label">spring-cache-app</text>
  <text x="284" y="470" text-anchor="middle" class="app-detail">Spring Boot · @Cacheable</text>
  <rect x="230" y="480" width="110" height="14" rx="3" fill="#e3f2fd"/>
  <text x="284" y="490" text-anchor="middle" class="app-proto proto-hotrod">Hot Rod · app-config</text>

  <!-- quarkus-cache-app -->
  <rect x="370" y="438" width="145" height="76" class="box-app"/>
  <text x="442" y="456" text-anchor="middle" class="app-label">quarkus-cache-app</text>
  <text x="442" y="470" text-anchor="middle" class="app-detail">Quarkus 3 · @CacheResult</text>
  <rect x="378" y="478" width="130" height="14" rx="3" fill="#e3f2fd"/>
  <text x="442" y="488" text-anchor="middle" class="app-proto proto-hotrod">Hot Rod · app-config</text>
  <rect x="378" y="496" width="130" height="14" rx="3" fill="#e3f2fd"/>
  <text x="442" y="506" text-anchor="middle" class="app-proto proto-hotrod">Hot Rod · event-tracking</text>

  <!-- Redis baseline inside healthcare group -->
  <rect x="55" y="510" width="145" height="48" class="box-redis"/>
  <text x="127" y="528" text-anchor="middle" class="app-label" style="fill:#c62828;">Redis (baseline)</text>
  <text x="127" y="542" text-anchor="middle" class="app-detail">bitnami/redis · port 6379</text>

  <!-- ================================================================ -->
  <!-- RIGHT COLUMN: platform cluster + its apps                        -->
  <!-- ================================================================ -->

  <!-- Platform cluster -->
  <rect x="570" y="145" width="490" height="250" class="box-platform"/>
  <text x="590" y="172" class="cluster-label">Cluster: platform</text>
  <text x="590" y="188" class="cluster-detail">3 replicas · 1 CPU · 2Gi mem · 1Gi persistent storage · Hot Rod + REST</text>

  <!-- Platform caches -->
  <rect x="590" y="200" width="200" height="55" class="box-cache-dist"/>
  <text x="690" y="218" text-anchor="middle" class="cache-label">user-sessions</text>
  <text x="690" y="232" text-anchor="middle" class="cache-detail">Distributed · SYNC · 2 owners</text>
  <text x="690" y="244" text-anchor="middle" class="cache-detail">TTL 30 min · 100K entries</text>

  <rect x="810" y="200" width="200" height="55" class="box-cache-repl"/>
  <text x="910" y="218" text-anchor="middle" class="cache-label">lookup-data</text>
  <text x="910" y="232" text-anchor="middle" class="cache-detail">Replicated · SYNC · all nodes</text>
  <text x="910" y="244" text-anchor="middle" class="cache-detail">No TTL · fileStore · 10K entries</text>

  <rect x="590" y="268" width="200" height="55" class="box-cache-dist"/>
  <text x="690" y="286" text-anchor="middle" class="cache-label">eap-sessions</text>
  <text x="690" y="300" text-anchor="middle" class="cache-detail">Distributed · SYNC · 2 owners</text>
  <text x="690" y="312" text-anchor="middle" class="cache-detail">TTL 30 min · 100K entries</text>

  <!-- Platform apps group -->
  <text x="815" y="415" text-anchor="middle" class="section-label">APPLICATIONS → platform</text>

  <rect x="570" y="425" width="490" height="145" class="box-apps-group"/>

  <!-- spring-session-app -->
  <rect x="585" y="438" width="145" height="60" class="box-app"/>
  <text x="657" y="456" text-anchor="middle" class="app-label">spring-session-app</text>
  <text x="657" y="470" text-anchor="middle" class="app-detail">Spring Boot · Sessions</text>
  <rect x="596" y="480" width="123" height="14" rx="3" fill="#e3f2fd"/>
  <text x="657" y="490" text-anchor="middle" class="app-proto proto-hotrod">Hot Rod · user-sessions</text>

  <!-- rest-loader-app -->
  <rect x="742" y="438" width="145" height="60" class="box-app"/>
  <text x="814" y="456" text-anchor="middle" class="app-label">rest-loader-app</text>
  <text x="814" y="470" text-anchor="middle" class="app-detail">Spring Boot · REST client</text>
  <rect x="758" y="480" width="113" height="14" rx="3" fill="#e8f5e9"/>
  <text x="814" y="490" text-anchor="middle" class="app-proto proto-rest">REST · lookup-data</text>

  <!-- eap-session-app -->
  <rect x="900" y="438" width="145" height="60" class="box-app"/>
  <text x="972" y="456" text-anchor="middle" class="app-label">eap-session-app</text>
  <text x="972" y="470" text-anchor="middle" class="app-detail">WildFly 34 / EAP 8</text>
  <rect x="912" y="480" width="120" height="14" rx="3" fill="#e3f2fd"/>
  <text x="972" y="490" text-anchor="middle" class="app-proto proto-hotrod">Hot Rod · eap-sessions</text>

  <!-- ================================================================ -->
  <!-- LEGEND : single row, horizontal distribution                     -->
  <!-- ================================================================ -->
  <rect x="40" y="610" width="1020" height="80" rx="6" fill="#fafafa" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Title -->
  <text x="55" y="635" style="font-size:10px; font-weight:700; fill:#333; letter-spacing:0.5px;">CACHES</text>

  <rect x="55" y="645" width="12" height="12" class="box-cache-dist"/>
  <text x="72" y="655" class="legend-text">Distributed</text>
  <rect x="140" y="645" width="12" height="12" class="box-cache-repl"/>
  <text x="157" y="655" class="legend-text">Replicated</text>
  <rect x="225" y="645" width="12" height="12" class="box-cache-auto"/>
  <text x="242" y="655" class="legend-text">Auto-created (RESP)</text>

  <!-- Divider -->
  <line x1="365" y1="622" x2="365" y2="678" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Clusters -->
  <text x="385" y="635" style="font-size:10px; font-weight:700; fill:#333; letter-spacing:0.5px;">CLUSTERS</text>

  <rect x="385" y="645" width="12" height="12" rx="2" fill="#0d47a1"/>
  <text x="402" y="655" class="legend-text">healthcare</text>
  <rect x="470" y="645" width="12" height="12" rx="2" fill="#4a148c"/>
  <text x="487" y="655" class="legend-text">platform</text>

  <!-- Divider -->
  <line x1="555" y1="622" x2="555" y2="678" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Protocols -->
  <text x="575" y="635" style="font-size:10px; font-weight:700; fill:#333; letter-spacing:0.5px;">PROTOCOLS</text>

  <rect x="575" y="643" width="50" height="14" rx="3" fill="#ffebee"/>
  <text x="600" y="654" text-anchor="middle" class="app-proto proto-resp">RESP</text>
  <text x="632" y="654" class="legend-text">Redis-compatible</text>

  <rect x="730" y="643" width="50" height="14" rx="3" fill="#e3f2fd"/>
  <text x="755" y="654" text-anchor="middle" class="app-proto proto-hotrod">Hot Rod</text>
  <text x="788" y="654" class="legend-text">Binary (default)</text>

  <rect x="885" y="643" width="50" height="14" rx="3" fill="#e8f5e9"/>
  <text x="910" y="654" text-anchor="middle" class="app-proto proto-rest">REST</text>
  <text x="942" y="654" class="legend-text">HTTP API</text>
</svg>

server.port=8080

# Redis/Data Grid connection: override via environment variables
# To switch from Redis to Data Grid, change only these values:
#   REDIS_HOST: redis → healthcare (Data Grid cluster service name)
#   REDIS_PORT: 6379 → 11222 (Data Grid single-port endpoint)
#   REDIS_USERNAME: default → app-healthcare
#   REDIS_PASSWORD: <redis-password> → <datagrid-password>
app.redis.host=${REDIS_HOST:redis}
app.redis.port=${REDIS_PORT:6379}
app.redis.username=${REDIS_USERNAME:default}
app.redis.password=${REDIS_PASSWORD:changeme}
app.redis.ssl=${REDIS_SSL:false}

app.cache.cluster=${CACHE_CLUSTER:standalone}
app.cache.name=${CACHE_NAME:respCache}
app.cache.mode=${CACHE_MODE:distributed}

management.endpoints.web.exposure.include=health,info

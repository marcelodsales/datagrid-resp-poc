server.port=8080

# Data Grid connection: override via environment variables
infinispan.remote.server-list=${DG_HOST:localhost}:${DG_PORT:11222}
infinispan.remote.auth-username=${DG_USERNAME:admin}
infinispan.remote.auth-password=${DG_PASSWORD:password}
infinispan.remote.auth-realm=default
infinispan.remote.sasl-mechanism=SCRAM-SHA-512

# SSL: enable for OpenShift (endpointEncryption: type: Service)
app.dg.ssl=${DG_SSL:false}

management.endpoints.web.exposure.include=health,info

---
- name: List Data Grid clusters
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Get all Infinispan CRs in rhdg-poc namespace
      kubernetes.core.k8s_info:
        api_version: infinispan.org/v1
        kind: Infinispan
        namespace: rhdg-poc
      register: clusters

    - name: Display cluster inventory
      ansible.builtin.debug:
        msg: |
          {% for cluster in clusters.resources %}
          - {{ cluster.metadata.name }}
            Replicas: {{ cluster.spec.replicas | default('N/A') }}
            CPU: {{ cluster.spec.container.cpu | default('N/A') }}
            Memory: {{ cluster.spec.container.memory | default('N/A') }}
            Type: {{ cluster.spec.service.type | default('N/A') }}
            Status: {{ cluster.status.conditions[0].type | default('Unknown') }}={{ cluster.status.conditions[0].status | default('Unknown') }}
          {% endfor %}
          Total: {{ clusters.resources | length }} clusters

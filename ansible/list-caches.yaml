---
- name: List Data Grid caches
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Get all Cache CRs in rhdg-poc namespace
      kubernetes.core.k8s_info:
        api_version: infinispan.org/v2alpha1
        kind: Cache
        namespace: rhdg-poc
      register: caches

    - name: Display cache inventory
      ansible.builtin.debug:
        msg: |
          {% for cache in caches.resources %}
          - {{ cache.metadata.name }} (cluster: {{ cache.spec.clusterName }})
          {% endfor %}
          Total: {{ caches.resources | length }} caches

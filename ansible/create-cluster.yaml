---
- name: Create Data Grid cluster via GitOps
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    gitea_url: "http://gitea.openshift-gitops.svc:3000"
    gitea_user: "gitea"
    gitea_password: "gitea2026"
    gitea_repo: "datagrid-poc"
    manifest_dir: "manifests"

  tasks:
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - cluster_name is defined and cluster_name | length > 0
          - replicas is defined and replicas | int > 0
          - cpu is defined and cpu | length > 0
          - memory is defined and memory | length > 0
        fail_msg: "Missing required variables: cluster_name, replicas, cpu, memory"

    - name: Generate credentials Secret from template
      ansible.builtin.template:
        src: templates/credentials-secret.yaml.j2
        dest: "/tmp/secret-{{ cluster_name }}.yaml"

    - name: Generate Infinispan CR from template
      ansible.builtin.template:
        src: templates/cluster-cr.yaml.j2
        dest: "/tmp/cluster-{{ cluster_name }}.yaml"

    - name: Read generated credentials manifest
      ansible.builtin.slurp:
        src: "/tmp/secret-{{ cluster_name }}.yaml"
      register: secret_content

    - name: Read generated cluster manifest
      ansible.builtin.slurp:
        src: "/tmp/cluster-{{ cluster_name }}.yaml"
      register: cluster_content

    - name: Display generated manifests for review
      ansible.builtin.debug:
        msg: |
          === Credentials Secret ===
          {{ secret_content.content | b64decode }}
          === Infinispan CR ===
          {{ cluster_content.content | b64decode }}

    - name: Clone Gitea repository
      ansible.builtin.git:
        repo: "http://{{ gitea_user }}:{{ gitea_password }}@gitea.openshift-gitops.svc:3000/{{ gitea_user }}/{{ gitea_repo }}.git"
        dest: "/tmp/gitea-{{ gitea_repo }}"
        version: main
        force: true

    - name: Determine next manifest number
      ansible.builtin.shell: |
        ls /tmp/gitea-{{ gitea_repo }}/{{ manifest_dir }}/*.yaml 2>/dev/null \
          | xargs -I{} basename {} \
          | grep -oP '^\d+' \
          | sort -n \
          | tail -1
      register: last_number
      changed_when: false

    - name: Set manifest numbers
      ansible.builtin.set_fact:
        secret_number: "{{ '%02d' % ((last_number.stdout | default('44') | int) + 1) }}"
        cluster_number: "{{ '%02d' % ((last_number.stdout | default('44') | int) + 2) }}"

    - name: Copy credentials manifest to repository
      ansible.builtin.copy:
        src: "/tmp/secret-{{ cluster_name }}.yaml"
        dest: "/tmp/gitea-{{ gitea_repo }}/{{ manifest_dir }}/{{ secret_number }}-{{ cluster_name }}-credentials.yaml"

    - name: Copy cluster manifest to repository
      ansible.builtin.copy:
        src: "/tmp/cluster-{{ cluster_name }}.yaml"
        dest: "/tmp/gitea-{{ gitea_repo }}/{{ manifest_dir }}/{{ cluster_number }}-cluster-{{ cluster_name }}.yaml"

    - name: Configure git user
      ansible.builtin.shell: |
        cd /tmp/gitea-{{ gitea_repo }}
        git config user.email "aap@redhat.com"
        git config user.name "Ansible Automation Platform"
      changed_when: false

    - name: Commit and push to Gitea
      ansible.builtin.shell: |
        cd /tmp/gitea-{{ gitea_repo }}
        git add {{ manifest_dir }}/{{ secret_number }}-{{ cluster_name }}-credentials.yaml
        git add {{ manifest_dir }}/{{ cluster_number }}-cluster-{{ cluster_name }}.yaml
        git commit -m "Add cluster {{ cluster_name }} ({{ replicas }} replicas, {{ cpu }} CPU, {{ memory }} mem)"
        git push origin main
      register: git_push

    - name: Display result
      ansible.builtin.debug:
        msg: >-
          Cluster '{{ cluster_name }}' manifests committed to Gitea
          ({{ secret_number }}-{{ cluster_name }}-credentials.yaml,
          {{ cluster_number }}-cluster-{{ cluster_name }}.yaml).
          ArgoCD will detect the change within ~30 seconds and create the cluster.

    - name: Clean up temporary files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/tmp/secret-{{ cluster_name }}.yaml"
        - "/tmp/cluster-{{ cluster_name }}.yaml"
        - "/tmp/gitea-{{ gitea_repo }}"
